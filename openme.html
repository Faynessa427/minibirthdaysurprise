<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shatter Heart</title>
  </head>
<body>
  <div class="heart" id="heart"></div>
  <button id="openbutton"> Open </button>
  <script>
  const openbutton = document.getElementById('openbutton');
  const heart = document.getElementById('heart');
 
   const savedColor = localStorage.getItem('favColor');

  if (savedColor) {
    heart.style.backgroundColor = savedColor;
    heart.style.setProperty('--heart-color', savedColor);
    openbutton.style.backgroundColor = savedColor;
  }

  openbutton.addEventListener('click', function() {
    heart.classList.add('shatter');

    setTimeout(function() {
      window.location.href = 'HappyBirthday.html';
    }, 600);
  });
</script>
<style>
      body {
      background-color: #e8d8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    
    .heart {
      width: 150px;
      height: 150px;
      transform: rotate(-45deg);
      animation: slideUp 0.8s ease backwards ;
      position: relative;
      margin-bottom: 80px;
    }

    
    .heart::before,
    .heart::after {
      content: "";
      width: 150px;
      height: 150px;
      border-radius: 50%;
      position: absolute;
      background: var(--heart-color);
    }

    .heart::before {
      top: -75px;
      left: 0;
    }

    .heart::after {
      left: 75px;
      top: 0;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      color: white;
      background-color: #ff4b5c;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e03e4e;
    }

    
    .shatter {
      animation: breakApart 0.6s forwards;
    }

    @keyframes breakApart {
      0% {
        transform: rotate(-45deg) scale(1);
        opacity: 1;
      }
      50% {
        transform: rotate(-45deg) scale(1.3) translate(10px, -10px);
        opacity: 0.5;
      }
      100% {
        transform: rotate(-45deg) scale(0);
        opacity: 0;
      }
    }
     @keyframes slideUp{
        0%{
            opacity: 0.4;
            transform: translateX(80px);
        }
      
        100%{
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }
    </style>
</body>
</html>
