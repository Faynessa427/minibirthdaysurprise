<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shatter Heart</title>
  </head>
<body>
  <div class="starfield" id="starfield"></div>
  <div class="heart" id="heart"></div>
  <button id="openbutton"> Open </button>
  <style>
      body {
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at top, rgba(255, 255, 255, 0.65), transparent 24%),
          linear-gradient(135deg, #fdd6ff, #d7e0ff, #ffebf2);
        background-size: 400% 400%;
        animation: bgShift 12s ease infinite;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .heart {
        width: 150px;
        height: 150px;
        transform: rotate(-45deg);
        transform-origin: center center;
        animation: slideUp 0.8s ease backwards, bounce 2.6s ease-in-out 0.8s infinite alternate;
        position: relative;
        margin-bottom: 80px;
        background: #ff4b5c;
        --heart-color: #ff4b5c;
        box-shadow: 0 0 26px rgba(255, 105, 180, 0.3), 0 20px 50px rgba(0, 0, 0, 0.1);
      }

      .heart::before,
      .heart::after {
        content: "";
        width: 150px;
        height: 150px;
        border-radius: 50%;
        position: absolute;
        background: var(--heart-color);
        filter: saturate(1.2);
      }

      .heart::before {
        top: -75px;
        left: 0;
      }

      .heart::after {
        left: 75px;
        top: 0;
      }

      .starfield {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        opacity: 0.7;
        filter: drop-shadow(0 0 8px currentColor);
        animation: sparkle 2.5s ease-in-out infinite;
      }

      @keyframes sparkle {
        0%, 100% {
          transform: scale(1);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.8);
          opacity: 1;
        }
      }

      button {
        padding: 15px 30px;
        font-size: 18px;
        color: white;
        background-color: #ff4b5c;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 12px 20px rgba(255, 75, 92, 0.25);
        transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
      }

      button:hover {
        background-color: #ff6a8c;
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 18px 28px rgba(255, 75, 92, 0.35);
      }

      button:active {
        transform: translateY(0) scale(0.98);
      }

      .shatter {
        animation: breakApart 0.6s forwards;
      }

      @keyframes breakApart {
        0% {
          transform: rotate(-45deg) scale(1);
          opacity: 1;
        }
        50% {
          transform: rotate(-45deg) scale(1.3) translate(10px, -10px);
          opacity: 0.5;
        }
        100% {
          transform: rotate(-45deg) scale(0);
          opacity: 0;
        }
      }

      @keyframes slideUp {
        0% {
          opacity: 0.4;
          transform: translateX(80px);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      @keyframes bounce {
        0% {
          transform: rotate(-45deg) scale(1);
        }
        50% {
          transform: rotate(-45deg) scale(1.08) translateY(-6px);
        }
        100% {
          transform: rotate(-45deg) scale(1);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-10px);
        }
      }

      @keyframes bgShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
  </style>
  <script src="openme.js"></script>
  </body>
</html>
