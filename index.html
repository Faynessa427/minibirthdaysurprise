<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Welcome </title>
</head>
<body> 
    <section class="card">
        <div class="welcome">
        <h1> Welcome!</h1>
        <p><strong> Enter your details. </strong></p>
        <p> Name:</p>
        <input type="text" id="name" placeholder="Enter your name" required>
        <p> Favourite color: </p>
        <input type="text" id="color" placeholder="Your favourite color" required>
        <p id="colorError"> </p>
       </div>
       <div>
        <button onclick="saveData()"> Enter</button>
    </div>
    <script>
        function saveData() {
            let name = document.getElementById('name').value;
            let color = document.getElementById('color').value.trim().toLowerCase();
                if (
                    color !== "blue" &&
                    color !== "green" &&
                    color !== "red" &&
                    color !== "pink" &&
                    color !== "purple" &&
                    color !== "navy" &&
                    color !=="yellow" &&
                    color !== "indigo" &&
                    color !== "white" &&
                    color !== "violet" &&
                    color !== "brown" &&
                    color !=="cyan"
                ){
                    document.getElementById('colorError').textContent=
                    "Color Invalid.";
                    return;
                }
                
            if (!name.trim() || !color.trim()){
                return;
            } 
            localStorage.setItem("username", name);
            localStorage.setItem("favColor", color);
            window.location.href="openme.html";

        }
    </script>
     <style> 
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #e8d8ff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .card{
            background-color: white;
            width: 320px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow:  0px 10px  white;
            animation: slideUp 0.5s ease-out;
        }
        #name{
            padding-bottom: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            border-radius: 5px;
            box-sizing: border-box;
        }
         #color{
            padding-bottom: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            border-radius: 5px;
        }
        #colorError{
            color: rgb(146, 2, 2);
            font-size: 25px;
        }
    button{
        margin-top: 15px;
        padding: 12px 15px;
        border: none;
        border-radius: 6px;
        background: rgb(37, 1, 37);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 3s;
    }
     @keyframes slideUp{
        0%{
            opacity: 0;
            transform: translateY(80px);
        }
        100%{
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    </style>
   </body>
